[workspace]
members = ["mdt-macros"]

[package]
name = "mdt-minecraft"
version = "0.6.0"
edition = "2024"
description = "Minecraft Download Toolkit - an ergonomic, low-level library for downloading and installing Minecraft versions and mod loaders."
license = "MIT"
repository = "https://github.com/Lavaver/MDT"
homepage = "https://github.com/Lavaver/MDT"
documentation = "https://docs.rs/mdt-minecraft"
keywords = ["minecraft", "launcher", "downloader", "modloader", "forge"]
categories = ["game-development", "api-bindings"]
readme = "README.md"

[lib]
name = "mdt"

[features]
default = []
cli = ["tui", "dep:clap"]
tui = ["dep:crossterm", "dep:ratatui"]

[dependencies]
mdt-macros = { version = "0.4.0", path = "mdt-macros" }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "fs", "io-util", "time"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
quick-xml = { version = "0.42.0", features = ["serialize"] }
sha1 = "0.11.0"
sha2 = "0.11"
md-5 = "0.11"
hex = "0.4.3"
zip = "9.0.5"
futures = "0.3.34"
thiserror = "2.0"

clap = { version = "4.6.7", features = ["derive"], optional = true }
crossterm = { version = "0.29.0", optional = true }
ratatui = { version = "0.30.2", optional = true }

[dev-dependencies]
serde_json = "1.0.154"
wiremock = "0.6"
